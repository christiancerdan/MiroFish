services:
  mirofish:
    build: .
    image: mirofish-maintained:local
    init: true
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5001"
      FLASK_DEBUG: "false"
    ports:
      - "127.0.0.1:3000:5001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - mirofish_uploads:/app/backend/uploads
      - mirofish_logs:/app/backend/logs

volumes:
  mirofish_uploads:
  mirofish_logs:
