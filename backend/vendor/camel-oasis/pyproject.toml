[project]
name = "camel-oasis"
version = "0.2.5+mirofish.2"
description = "OASIS 0.2.5 with reviewed MiroFish runtime dependencies"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "CAMEL-AI.org" }]
dependencies = [
    "cairocffi>=1.7.1,<2",
    "camel-ai==0.2.90",
    "igraph>=0.11.6,<0.12",
    "neo4j>=5.23.0,<6",
    "numpy>=1.26.4,<3",
    "pandas>=2.2.2,<3",
    "scikit-learn>=1.8.0,<2",
    "sentence-transformers>=6.1.0,<7",
    "torch>=2.14.1,<3",
    "tqdm>=4.67.1,<5",
    "transformers>=5.18.0,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oasis"]
