[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.1.3,<4",
    "werkzeug>=3.1.6,<4",
    "waitress>=3.0.2,<4",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.109.1,<2",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.2.2,<2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
simulation = [
    "camel-oasis==0.2.5+mirofish.1",
    "camel-ai==0.2.90",
    "mcp>=1.30.0,<2",
    "pillow>=12.3.0,<13",
    "sentence-transformers>=6.1.0,<7",
    "transformers>=5.18.0,<6",
    "torch>=2.14.1,<3",
]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.0,<2",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
camel-oasis = { path = "vendor/camel-oasis" }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
