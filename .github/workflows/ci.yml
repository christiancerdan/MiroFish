name: Test and dependency checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      LLM_API_KEY: ci-dummy-key
      LLM_BASE_URL: http://127.0.0.1:9/v1
      ZEP_API_KEY: ci-dummy-key
      FLASK_DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - name: Verify lock and resolve the locked core test dependencies
        run: |
          uv lock --check --directory backend
          uv export --directory backend --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/full-requirements.txt" > /dev/null
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('backend/pyproject.toml').read_text())
          # Tests mock provider/simulation boundaries. The heavy simulation tree
          # is audited separately; see docs/dependency-security.md for coverage.
          excluded = ('camel-ai', 'camel-oasis', 'mcp')
          core = [item for item in project['project']['dependencies'] if not item.startswith(excluded)]
          Path(os.environ['RUNNER_TEMP'], 'core.in').write_text('\n'.join(core) + '\n')
          PY
          uv pip compile "$RUNNER_TEMP/core.in" --constraint "$RUNNER_TEMP/full-requirements.txt" --python "$(command -v python)" --output-file "$RUNNER_TEMP/core-requirements.txt"
          uv pip install --system -r "$RUNNER_TEMP/core-requirements.txt" 'pytest==9.1.1'
      - name: Backend regression and security tests
        working-directory: backend
        run: python -m pytest tests -q
      - name: Root regression tests
        run: python -m unittest discover -s tests -q
      - name: Audit the locked core runtime
        run: uvx pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/core-requirements.txt" --format json --output "$RUNNER_TEMP/core-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-audit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/core-audit.json
          if-no-files-found: warn

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  simulation-dependency-report:
    name: Full simulation dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - name: Export the complete locked runtime without installing simulation libraries
        run: uv export --directory backend --locked --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/full-requirements.txt" > /dev/null
      - name: Report upstream-constrained findings
        id: audit
        # The documented OASIS pins still have advisories. This report is visible
        # but not a false claim that the complete simulation tree passes a gate.
        continue-on-error: true
        run: uvx pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/full-requirements.txt" --format json --output "$RUNNER_TEMP/full-audit.json"
      - name: Summarize inventory and require a valid scanner result
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'full-audit.json').read_text())
          affected = [item for item in report['dependencies'] if item.get('vulns')]
          findings = {(item['name'], vuln['id']) for item in affected for vuln in item['vulns']}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Full simulation inventory: {len(findings)} distinct package/advisory matches in {len(affected)} packages.\n\n')
              summary.write('Advisory report only: see docs/dependency-security.md for upstream constraints and reachability limits.\n\n')
              for item in affected:
                  summary.write(f"- {item['name']} {item['version']}: {len({v['id'] for v in item['vulns']})} distinct IDs\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-simulation-dependency-audit
          path: |
            ${{ runner.temp }}/full-audit.json
            ${{ runner.temp }}/full-requirements.txt
          if-no-files-found: error
